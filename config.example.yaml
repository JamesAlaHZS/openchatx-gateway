# OpenChatX Claude & Gemini Gateway Configuration
# Values support environment variable expansion: ${VAR} or ${VAR:-default}

server:
  # Public HTTPS URL of the gateway as reached by Google Gemini / Anthropic Claude servers.
  # Example with Tailscale Funnel: https://your-machine-name.your-tailnet.ts.net
  # Example with Cloudflare Tunnel: https://your-subdomain.trycloudflare.com
  public_url: https://your-tunnel-url.example.com
  host: 127.0.0.1
  port: 8765
  trusted_proxy_ips: 127.0.0.1

auth:
  # Encryption key used to protect registered OAuth client credentials and tokens.
  # Generated automatically by scripts/setup.sh, or set via MCP_GATEWAY_ENCRYPTION_KEY.
  encryption_key: ${MCP_GATEWAY_ENCRYPTION_KEY:-}

  # Local users allowed to approve OAuth authorization requests.
  # Generate a bcrypt password hash using: python3 scripts/hash_password.py
  users:
    - username: openchatx
      password_hash: "$2b$12$5BqOSm8a9DHyejlFZW9Pv.iBFvF.GEUVw6wtjCtuYRusmT.mLNH7e"
      # Default credentials generated above:
      # Username: openchatx
      # Password: openchatx

  # Lifetimes (seconds)
  access_token_expiry_seconds: 3600
  refresh_token_expiry_seconds: 2592000   # 30 days
  login_session_expiry_seconds: 28800     # 8 hours

  # Scopes advertised to MCP clients (includes Google Account Linking compatibility scope)
  scopes_supported:
    - "mcp"
    - "offline_access"
    - "ACCESS_VIEW_MANAGE_MCP_CONTENT"

  # Pre-registered static OAuth clients (for Gemini Web "Advanced features" or Gemini Enterprise)
  static_clients:
    - client_id: "openchatx-gemini"
      client_secret: "openchatx-gemini-secret"
      client_name: "Google Gemini Connected App"

  # Allowed OAuth redirect URIs (Claude Web/App, Gemini Web/Spark, Gemini Enterprise, and Loopback)
  allowed_client_redirect_uris:
    - "https://claude.ai/api/mcp/auth_callback"
    - "https://claude.com/api/mcp/auth_callback"
    - "https://oauth-redirect.googleusercontent.com/*"
    - "https://oauth-redirect-sandbox.googleusercontent.com/*"
    - "https://oauth-redirect-test.googleusercontent.com/*"
    - "https://gemini.google.com/*"
    - "https://vertexaisearch.cloud.google.com/oauth-redirect"
    - "https://vertexaisearch.cloud.google.com/static/oauth/oauth.html"
    - "http://localhost:*/callback"
    - "http://localhost:*/*"
    - "http://127.0.0.1:*/callback"
    - "http://127.0.0.1:*/*"

storage:
  path: ./gateway.db

backends:
  # Local OpenChatX Core Runtime
  # OpenChatX desktop app serves its MCP endpoint on port 8001 by default.
  openchatx:
    url: http://127.0.0.1:8001/mcp
    auth:
      type: none
